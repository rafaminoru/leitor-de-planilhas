name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Empacota o .app macOS
        run: npx electron-builder --mac zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Copia o zip para downloads
        run: |
          mkdir -p downloads
          ZIP=$(find release -name '*.zip' -print -quit)
          echo "ZIP=$ZIP"
          ls -lh release || true
          cp "$ZIP" downloads/Visualizador-de-Planilhas-macOS.zip
          ls -lh downloads/Visualizador-de-Planilhas-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Visualizador-de-Planilhas-macOS
          path: downloads/Visualizador-de-Planilhas-macOS.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Visualizador de Planilhas 1.0.0
          files: downloads/Visualizador-de-Planilhas-macOS.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## Downloads
            - Windows: [Visualizador-de-Planilhas.exe](https://github.com/rafaminoru/leitor-de-planilhas/raw/main/downloads/Visualizador-de-Planilhas.exe)
            - macOS Apple Silicon: anexo deste release
